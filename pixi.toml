line-profiler = ">=5.0.2, <6"
matplotlib = ">=3.10.8, <4"
numba = ">=0.64.0, <0.65"
numexpr = ">=2.14.1, <3"
numpy = ">=2.4.2, <3"
pandas = ">=3.0.1, <4"
pyinstrument = ">=5.1.2, <6"
pympler = ">=1.1, <2"
pytest = ">=9.0.2, <10"
seaborn = ">=0.13.2, <0.14"
snakeviz = ">=2.2.2, <3"
tqdm = ">=4.67.3, <5"
memory-profiler = ">=0.61.0, <0.62"
